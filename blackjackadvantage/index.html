<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackjack Advantage</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%83%8F%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f5f5f6;
    --panel:#ffffff;
    --panel-2:#f0f0f2;
    --border:#e2e2e6;
    --text:#101114;
    --text-dim:#6b7280;
    --accent:#158a4d;
    --accent-dim:#0f6b3c;
    --lose:#dc2626;
    --tie:#b45309;
    --red:#c0362c;
    --black:#1c1c22;
    --gold:#a9791f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
  }
  a{color:inherit;}
  .app{
    max-width:1100px;
    margin:0 auto;
    padding:24px 20px 60px;
  }
  .back-link{
    display:inline-block;
    font-size:12.5px;
    color:var(--text-dim);
    text-decoration:none;
    margin-bottom:14px;
  }
  .back-link:hover{color:var(--text);}
  header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    margin-bottom:20px;
    gap:16px;
    flex-wrap:wrap;
  }
  .header-left h1{
    font-size:22px;
    font-weight:650;
    letter-spacing:-0.01em;
    margin:0 0 10px;
  }
  .counter-row{
    display:flex;
    gap:8px;
  }
  .counter-chip{
    display:flex;
    align-items:baseline;
    gap:5px;
    padding:6px 12px;
    border-radius:8px;
    background:var(--panel-2);
    border:1px solid var(--border);
    font-size:12px;
    font-weight:600;
    color:var(--text-dim);
  }
  .counter-chip b{
    font-size:15px;
    color:var(--text);
  }
  .counter-chip.win{border-color:rgba(21,138,77,.35);}
  .counter-chip.win b{color:var(--accent);}
  .counter-chip.push{border-color:rgba(180,83,9,.35);}
  .counter-chip.push b{color:var(--tie);}
  .counter-chip.lose{border-color:rgba(220,38,38,.35);}
  .counter-chip.lose b{color:var(--lose);}
  .btn-reset{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text-dim);
    padding:8px 16px;
    border-radius:8px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    transition:all .15s ease;
    flex-shrink:0;
  }
  .btn-reset:hover{
    border-color:var(--lose);
    color:var(--lose);
  }

  .bank-row{
    display:flex;
    gap:10px;
    margin-bottom:20px;
    flex-wrap:wrap;
  }
  .bank-card{
    flex:1;
    min-width:160px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 16px;
  }
  .bank-card .label{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim);}
  .bank-card .amount{font-size:22px; font-weight:800; margin-top:4px; font-variant-numeric:tabular-nums;}
  .bank-card.you .amount{color:var(--gold);}
  .bank-card.house .amount{color:var(--text);}

  .layout{
    display:grid;
    grid-template-columns:300px 1fr;
    gap:20px;
    align-items:start;
  }
  @media (max-width: 860px){
    .layout{grid-template-columns:1fr;}
    .table{order:-1;}
  }
  .table, .odds-panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:16px;
    padding:22px;
  }
  .section-block{margin-bottom:26px;}
  .section-block:last-child{margin-bottom:0;}
  .section-block h2, .panel-block h2{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--text-dim);
    margin:0 0 12px;
    font-weight:700;
  }
  .hand-tabs{
    display:flex;
    gap:8px;
    margin-bottom:12px;
    flex-wrap:wrap;
  }
  .hand-tabs.hidden{display:none;}
  .hand-tab{
    padding:7px 14px;
    border-radius:8px;
    border:1.5px solid var(--border);
    background:var(--panel-2);
    color:var(--text-dim);
    font-size:12.5px;
    font-weight:700;
    cursor:pointer;
    transition:all .12s ease;
  }
  .hand-tab.active{border-color:var(--accent);color:var(--text);background:rgba(21,138,77,.12);}
  .hand-tab.done{opacity:.55;}
  .card-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    min-height:106px;
  }
  .card-slot{
    width:76px;
    height:106px;
    border-radius:10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    user-select:none;
    position:relative;
    flex-shrink:0;
  }
  .card-slot.filled{
    background:#f4f2ec;
    border:1px solid #d8d5cb;
    box-shadow:0 4px 14px rgba(16,17,20,.10);
  }
  .card-slot .card-rank{
    font-size:30px;
    font-weight:700;
    line-height:1;
  }
  .card-slot .card-suit{
    font-size:22px;
    line-height:1.3;
  }
  .card-rank.red, .card-suit.red{color:var(--red);}
  .card-rank.black, .card-suit.black{color:var(--black);}
  .card-slot.back{
    background:repeating-linear-gradient(135deg, #e2e2e6, #e2e2e6 7px, #d3d3d8 7px, #d3d3d8 14px);
    border:1px solid #cfcfd4;
  }
  .card-slot.back::after{
    content:"";
    width:36px;
    height:52px;
    border:1.5px solid #b8b8bf;
    border-radius:6px;
  }

  .hand-total{
    font-size:13px;
    color:var(--text-dim);
    margin:10px 0 0;
    font-weight:600;
    min-height:19px;
  }
  .hand-total .val{color:var(--text);font-weight:700;}
  .hand-total .bet-tag{color:var(--gold); font-weight:700;}
  .hand-total .tag{
    display:inline-block;
    margin-left:8px;
    padding:2px 8px;
    border-radius:6px;
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .tag.bust, .tag.lose{background:rgba(220,38,38,.12);color:var(--lose);}
  .tag.blackjack, .tag.win{background:rgba(21,138,77,.12);color:var(--accent);}
  .tag.push{background:rgba(180,83,9,.12);color:var(--tie);}
  .tag.done{background:var(--panel-2);color:var(--text-dim);}

  .action-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:18px;
  }
  .action-btn{
    flex:1;
    min-width:88px;
    padding:12px 8px;
    border-radius:10px;
    border:1.5px solid var(--border);
    background:var(--panel-2);
    color:var(--text);
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    transition:all .12s ease;
  }
  .action-btn:hover:not(:disabled){border-color:var(--accent);}
  .action-btn:disabled{opacity:.3;cursor:not-allowed;}

  .insurance-banner{
    margin-top:18px;
    padding:16px;
    border-radius:12px;
    background:var(--panel-2);
    border:1.5px solid var(--tie);
  }
  .insurance-banner p{
    margin:0 0 12px;
    font-size:13px;
    color:var(--text-dim);
    line-height:1.5;
  }
  .insurance-banner .btn-row{
    display:flex;
    gap:8px;
  }
  .insurance-banner button{
    flex:1;
    padding:11px 8px;
    border-radius:9px;
    border:1.5px solid var(--border);
    background:var(--panel);
    color:var(--text);
    font-size:13px;
    font-weight:700;
    cursor:pointer;
  }
  .insurance-banner button:hover{border-color:var(--tie);}

  .bet-row{
    margin-top:18px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }
  .bet-row.hidden{display:none;}
  .chip-row{display:flex; gap:8px; flex-wrap:wrap; justify-content:center;}
  .chip-btn{
    width:56px; height:56px; border-radius:50%;
    border:2px dashed rgba(16,17,20,.18);
    background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.8), transparent 60%), var(--panel-2);
    color:var(--text);
    font-size:13px; font-weight:800;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:transform .1s ease, border-color .1s ease;
  }
  .chip-btn:hover{transform:translateY(-2px); border-color:var(--gold);}
  .chip-btn.active{border-color:var(--gold); border-style:solid; box-shadow:0 0 0 3px rgba(169,121,31,.22);}
  .bet-amount-row{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--text-dim);}
  .bet-amount-row b{color:var(--gold); font-size:16px;}
  .btn-deal{
    padding:14px 40px;
    border-radius:12px;
    border:none;
    background:var(--accent);
    color:#ffffff;
    font-size:15px;
    font-weight:800;
    letter-spacing:.02em;
    cursor:pointer;
    transition:transform .12s ease, background .12s ease;
  }
  .btn-deal:hover:not(:disabled){background:var(--accent-dim);transform:translateY(-1px);}
  .btn-deal:disabled{opacity:.4; cursor:not-allowed;}
  .broke-note{font-size:12.5px; color:var(--lose); text-align:center;}

  .panel-block{margin-bottom:24px;}
  .panel-block:last-child{margin-bottom:0;}
  .odds-bars, .hand-chances{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .odds-row{
    display:grid;
    grid-template-columns:44px 1fr 52px;
    align-items:center;
    gap:10px;
    font-size:13px;
    color:var(--text-dim);
  }
  .bar{
    height:8px;
    background:var(--panel-2);
    border-radius:6px;
    overflow:hidden;
  }
  .bar.small{height:6px;}
  .bar-fill{
    height:100%;
    width:0%;
    border-radius:6px;
    transition:width .35s ease;
  }
  .bar-fill.win{background:var(--accent);}
  .bar-fill.tie{background:var(--tie);}
  .bar-fill.lose{background:var(--lose);}
  .bar-fill.chance{background:var(--accent-dim);}
  .odds-row span:last-child{
    text-align:right;
    font-weight:700;
    color:var(--text);
  }
  .chance-row{
    display:grid;
    grid-template-columns:1fr 70px 50px;
    align-items:center;
    gap:10px;
    font-size:12.5px;
    color:var(--text-dim);
  }
  .chance-pct{text-align:right;font-weight:700;color:var(--text);}
  .placeholder{
    font-size:13px;
    color:var(--text-dim);
    margin:0;
  }

  @media (max-width: 520px){
    .app{padding:16px 12px 40px;}
    header{margin-bottom:20px;}
    .header-left h1{font-size:19px;}
    .table, .odds-panel{padding:16px;border-radius:14px;}
    .card-row{gap:8px;}
    .card-slot{width:58px;height:82px;border-radius:9px;}
    .card-slot.back::after{width:26px;height:38px;}
    .card-slot .card-rank{font-size:22px;}
    .card-slot .card-suit{font-size:16px;}
    .action-btn{min-width:72px;font-size:12px;padding:10px 6px;}
  }
</style>
</head>
<body>
<div class="app">
  <a class="back-link" href="../index.html">&larr; Casino</a>
  <header>
    <div class="header-left">
      <h1>Blackjack Advantage</h1>
      <div class="counter-row">
        <span class="counter-chip win">Win <b id="winCount">0</b></span>
        <span class="counter-chip push">Push <b id="pushCount">0</b></span>
        <span class="counter-chip lose">Lose <b id="loseCount">0</b></span>
      </div>
    </div>
    <button class="btn-reset" id="resetBtn">Reset</button>
  </header>

  <div class="bank-row">
    <div class="bank-card you">
      <div class="label">You</div>
      <div class="amount" id="playerBank">$1,000</div>
    </div>
    <div class="bank-card house">
      <div class="label">House</div>
      <div class="amount" id="houseBank">$1,000</div>
    </div>
  </div>

  <div class="layout">
    <aside class="odds-panel">
      <div class="panel-block">
        <h2>Win Odds</h2>
        <div class="odds-bars">
          <div class="odds-row">
            <span>Win</span>
            <div class="bar"><div class="bar-fill win" id="winBar"></div></div>
            <span id="winPct">&ndash;</span>
          </div>
          <div class="odds-row">
            <span>Push</span>
            <div class="bar"><div class="bar-fill tie" id="pushBar"></div></div>
            <span id="pushPct">&ndash;</span>
          </div>
          <div class="odds-row">
            <span>Lose</span>
            <div class="bar"><div class="bar-fill lose" id="loseBar"></div></div>
            <span id="losePct">&ndash;</span>
          </div>
        </div>
      </div>
      <div class="panel-block">
        <h2>Dealer Outcome</h2>
        <div class="hand-chances" id="dealerChances">
          <p class="placeholder">Press Deal to start a hand</p>
        </div>
      </div>
    </aside>

    <section class="table">
      <div class="section-block">
        <h2>Dealer</h2>
        <div class="card-row" id="dealerRow"></div>
      </div>
      <div class="section-block">
        <h2>You</h2>
        <div class="hand-tabs hidden" id="handTabs"></div>
        <div class="card-row" id="playerRow"></div>
        <p class="hand-total" id="handTotal"></p>

        <div class="action-row" id="actionRow">
          <button class="action-btn" id="btnHit">Hit</button>
          <button class="action-btn" id="btnStand">Stand</button>
          <button class="action-btn" id="btnDouble">Double</button>
          <button class="action-btn" id="btnSplit">Split</button>
          <button class="action-btn" id="btnSurrender">Surrender</button>
        </div>

        <div class="insurance-banner" id="insuranceBanner" style="display:none;">
          <p>Dealer is showing an Ace. Take insurance (half your bet, pays 2:1)?</p>
          <div class="btn-row">
            <button id="btnInsuranceYes">Take Insurance</button>
            <button id="btnInsuranceNo">No Insurance</button>
          </div>
        </div>

        <div class="bet-row" id="betRow">
          <div class="chip-row" id="chipRow"></div>
          <div class="bet-amount-row">Bet: <b id="betAmount">$25</b></div>
          <button class="btn-deal" id="dealBtn">Deal</button>
          <p class="broke-note" id="brokeNote" style="display:none;">You're out of chips &mdash; hit Reset to reload $1,000.</p>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
(function(){
  "use strict";

  const SUITS = ['S','H','D','C'];
  function suitSymbol(s){ return {S:'♠',H:'♥',D:'♦',C:'♣'}[s]; }
  function suitColor(s){ return (s==='H'||s==='D') ? 'red' : 'black'; }
  function rankDisplay(r){ return r<=10 ? String(r) : {11:'J',12:'Q',13:'K',14:'A'}[r]; }

  function handValue(cards){
    let total=0, aces=0;
    cards.forEach(c=>{
      let v = c.r===14 ? 11 : (c.r>=10 ? 10 : c.r);
      if(c.r===14) aces++;
      total += v;
    });
    while(total>21 && aces>0){ total-=10; aces--; }
    return { total, soft: aces>0, isBust: total>21 };
  }

  function buildDeck(){
    const deck=[];
    for(let r=2;r<=14;r++) for(const s of SUITS) deck.push({r,s});
    return deck;
  }
  function removeUsed(deck, used){
    const usedKeys = new Set(used.map(c=>c.r+c.s));
    return deck.filter(c=>!usedKeys.has(c.r+c.s));
  }
  function shuffle(arr){
    const a=arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  function simulateDealer(playerTotal, dealerUpCard, knownCards, trials){
    const baseDeck = removeUsed(buildDeck(), knownCards);
    let win=0, push=0, lose=0;
    const outcomeCounts = {bust:0, 17:0, 18:0, 19:0, 20:0, 21:0};

    for(let t=0;t<trials;t++){
      const deck = shuffle(baseDeck);
      let ptr=0;
      const dealerCards = [dealerUpCard, deck[ptr++]];
      let dv = handValue(dealerCards);
      while(dv.total<17){
        dealerCards.push(deck[ptr++]);
        dv = handValue(dealerCards);
      }
      if(dv.isBust){
        outcomeCounts.bust++;
        win++;
      } else {
        const key = Math.min(dv.total,21);
        if(outcomeCounts[key]!==undefined) outcomeCounts[key]++;
        if(dv.total>playerTotal) lose++;
        else if(dv.total===playerTotal) push++;
        else win++;
      }
    }

    return {
      win: win/trials*100,
      push: push/trials*100,
      lose: lose/trials*100,
      outcomes: Object.fromEntries(Object.entries(outcomeCounts).map(([k,v])=>[k, v/trials*100]))
    };
  }

  // ---------- Bank ----------
  const BANK_KEY = 'bj_advantage_bank_v1';
  const STARTING_BANK = 1000;
  const CHIPS = [5, 25, 100, 200];
  let bank = { player: STARTING_BANK, house: STARTING_BANK };
  let betAmount = 25;

  function loadBank(){
    try{
      const saved = JSON.parse(localStorage.getItem(BANK_KEY));
      if(saved && typeof saved.player==='number' && typeof saved.house==='number') bank = saved;
    }catch(e){}
  }
  function saveBank(){
    try{ localStorage.setItem(BANK_KEY, JSON.stringify(bank)); }catch(e){}
  }
  function fmt(n){ return '$' + Math.round(n).toLocaleString('en-US'); }
  function renderBank(){
    document.getElementById('playerBank').textContent = fmt(bank.player);
    document.getElementById('houseBank').textContent = fmt(bank.house);
  }
  // Positive amount = house pays player that much; negative = player pays house.
  function settle(amount){
    bank.player += amount;
    bank.house -= amount;
    saveBank();
    renderBank();
  }

  // ---------- Game state ----------
  let deck = [];
  let dealer = { cards: [], holeHidden: true };
  let hands = [];
  let activeHandIndex = 0;
  let phase = 'idle'; // idle | insurance | player | dealer | result
  let insuranceTaken = false;
  let pendingPlayerBJ = false;
  let counters = { win:0, push:0, lose:0 };
  let calcTimer = null;

  function activeHand(){ return hands[activeHandIndex]; }
  function drawCard(){ if(deck.length===0) deck = shuffle(buildDeck()); return deck.pop(); }
  function otherHandsCards(h){
    const list=[];
    hands.forEach(x=>{ if(x!==h) x.cards.forEach(c=>list.push(c)); });
    return list;
  }

  function currentBaseBet(){
    return Math.min(betAmount, bank.player);
  }

  function startRound(){
    const bet = currentBaseBet();
    if(bet<=0) return;
    settle(-bet); // player stakes the bet up front
    deck = shuffle(buildDeck());
    dealer = { cards:[drawCard(), drawCard()], holeHidden:true };
    hands = [{ cards:[drawCard(), drawCard()], bet, done:false, doubled:false, surrendered:false, acesSplit:false, insurance:0, result:null }];
    activeHandIndex = 0;
    insuranceTaken = false;
    resolveInitialDeal();
  }

  function resolveInitialDeal(){
    const hand = hands[0];
    const playerBJ = handValue(hand.cards).total===21;
    const dealerUpAce = dealer.cards[0].r===14;
    if(dealerUpAce){
      pendingPlayerBJ = playerBJ;
      phase='insurance';
      renderAll();
      return;
    }
    if(playerBJ){
      peekDealer(playerBJ);
      return;
    }
    phase='player';
    renderAll();
    scheduleOdds();
  }

  function takeInsurance(taken){
    const hand = hands[0];
    if(taken){
      const ins = Math.min(hand.bet/2, bank.player);
      hand.insurance = ins;
      settle(-ins);
    }
    insuranceTaken = taken;
    peekDealer(pendingPlayerBJ);
  }

  function peekDealer(playerBJ){
    dealer.holeHidden = false;
    const dv = handValue(dealer.cards);
    const dealerBJ = dv.total===21;
    const hand = hands[0];
    if(dealerBJ){
      if(hand.insurance>0) settle(hand.insurance*3); // return stake + 2:1 payout
      hand.done = true;
      hand.result = playerBJ ? 'push' : 'lose';
      if(hand.result==='push') settle(hand.bet);
      finishRound();
      return;
    }
    if(playerBJ){
      hand.done = true;
      hand.result = 'blackjack';
      settle(hand.bet*2.5);
      finishRound();
      return;
    }
    dealer.holeHidden = true;
    phase='player';
    renderAll();
    scheduleOdds();
  }

  function finishRound(){
    phase='result';
    updateCounters();
    renderAll();
    updateOddsDisplay(null);
  }

  function updateCounters(){
    hands.forEach(h=>{
      if(h.result==='win' || h.result==='blackjack') counters.win++;
      else if(h.result==='push') counters.push++;
      else counters.lose++;
    });
  }

  function doHit(){
    if(phase!=='player') return;
    const hand = activeHand();
    hand.cards.push(drawCard());
    const {isBust} = handValue(hand.cards);
    if(isBust){ hand.done=true; hand.result='bust'; }
    advance();
  }

  function doStand(){
    if(phase!=='player') return;
    activeHand().done = true;
    advance();
  }

  function doDouble(){
    if(phase!=='player') return;
    const hand = activeHand();
    if(!(hand.cards.length===2 && !hand.done)) return;
    const extra = Math.min(hand.bet, bank.player);
    settle(-extra);
    hand.bet += extra;
    hand.doubled = true;
    hand.cards.push(drawCard());
    const {isBust} = handValue(hand.cards);
    hand.done = true;
    if(isBust) hand.result='bust';
    advance();
  }

  function doSplit(){
    if(phase!=='player') return;
    const hand = activeHand();
    if(!(hand.cards.length===2 && hand.cards[0].r===hand.cards[1].r && hands.length<4 && !hand.done)) return;
    if(bank.player < hand.bet) return; // need to fund the second hand's bet
    settle(-hand.bet);
    const [c1,c2] = hand.cards;
    const isAce = c1.r===14;
    const handA = { cards:[c1, drawCard()], bet:hand.bet, done:false, doubled:false, surrendered:false, acesSplit:isAce, insurance:0, result:null };
    const handB = { cards:[c2, drawCard()], bet:hand.bet, done:false, doubled:false, surrendered:false, acesSplit:isAce, insurance:0, result:null };
    if(isAce){ handA.done=true; handB.done=true; }
    hands.splice(activeHandIndex, 1, handA, handB);
    advance();
  }

  function doSurrender(){
    if(phase!=='player') return;
    const hand = activeHand();
    if(!(hand.cards.length===2 && !hand.done && hands.length===1)) return;
    hand.done = true;
    hand.surrendered = true;
    hand.result = 'surrender';
    settle(hand.bet/2);
    advance();
  }

  function advance(){
    renderAll();
    const nextIdx = hands.findIndex(h=>!h.done);
    if(nextIdx!==-1){
      activeHandIndex = nextIdx;
      renderAll();
      scheduleOdds();
      return;
    }
    dealerTurn();
  }

  function dealerTurn(){
    phase='dealer';
    dealer.holeHidden = false;
    renderAll();
    setTimeout(()=>{
      const anyLive = hands.some(h=> !h.surrendered && h.result!=='bust');
      if(anyLive){
        let dv = handValue(dealer.cards);
        while(dv.total<17){
          dealer.cards.push(drawCard());
          dv = handValue(dealer.cards);
        }
      }
      resolveResults();
      finishRound();
    }, 500);
  }

  function resolveResults(){
    const dv = handValue(dealer.cards);
    hands.forEach(h=>{
      if(h.result) return; // already settled (bust) or blackjack/push above
      const pv = handValue(h.cards);
      if(dv.isBust) h.result='win';
      else if(pv.total>dv.total) h.result='win';
      else if(pv.total===dv.total) h.result='push';
      else h.result='lose';

      if(h.result==='win') settle(h.bet*2);
      else if(h.result==='push') settle(h.bet);
      // 'lose' and already-settled 'bust' keep the house's stake, no further settle needed
    });
  }

  // ---------- Rendering ----------
  function renderCardSlot(el, card){
    el.className = 'card-slot';
    el.innerHTML='';
    if(card){
      el.classList.add('filled');
      const color = suitColor(card.s);
      el.innerHTML = `<span class="card-rank ${color}">${rankDisplay(card.r)}</span><span class="card-suit ${color}">${suitSymbol(card.s)}</span>`;
    } else {
      el.classList.add('back');
    }
  }

  function renderDealerRow(){
    const container = document.getElementById('dealerRow');
    container.innerHTML='';
    dealer.cards.forEach((c,i)=>{
      const el = document.createElement('div');
      if(i===1 && dealer.holeHidden){
        renderCardSlot(el, null);
      } else {
        renderCardSlot(el, c);
      }
      container.appendChild(el);
    });
  }

  function renderHandTabs(){
    const container = document.getElementById('handTabs');
    if(hands.length<=1){ container.classList.add('hidden'); container.innerHTML=''; return; }
    container.classList.remove('hidden');
    container.innerHTML='';
    hands.forEach((h,i)=>{
      const btn = document.createElement('button');
      btn.type='button';
      btn.className = 'hand-tab' + (i===activeHandIndex?' active':'') + (h.done?' done':'');
      const hv = handValue(h.cards);
      btn.textContent = `Hand ${i+1} (${hv.total})`;
      btn.addEventListener('click', ()=>{
        activeHandIndex=i;
        renderAll();
        if(phase==='player') scheduleOdds();
      });
      container.appendChild(btn);
    });
  }

  function renderPlayerRow(){
    const container = document.getElementById('playerRow');
    container.innerHTML='';
    const hand = activeHand();
    if(!hand) return;
    hand.cards.forEach(c=>{
      const el = document.createElement('div');
      renderCardSlot(el, c);
      container.appendChild(el);
    });
  }

  function renderHandTotal(){
    const el = document.getElementById('handTotal');
    const hand = activeHand();
    if(!hand || hand.cards.length===0){ el.textContent=''; return; }
    const {total, soft} = handValue(hand.cards);
    let html = `Total: <span class="val">${soft && total<=21 ? 'Soft ' : ''}${total}</span> &middot; Bet: <span class="bet-tag">${fmt(hand.bet)}</span>`;
    if(hand.result==='bust') html += `<span class="tag bust">Bust</span>`;
    else if(hand.result==='blackjack') html += `<span class="tag blackjack">Blackjack!</span>`;
    else if(hand.result==='win') html += `<span class="tag win">Win</span>`;
    else if(hand.result==='push') html += `<span class="tag push">Push</span>`;
    else if(hand.result==='surrender') html += `<span class="tag lose">Surrendered</span>`;
    else if(hand.result==='lose') html += `<span class="tag lose">Lose</span>`;
    else if(hand.doubled) html += `<span class="tag done">Doubled</span>`;
    else if(hand.done) html += `<span class="tag done">Standing</span>`;
    el.innerHTML = html;
  }

  function renderChips(){
    const row = document.getElementById('chipRow');
    row.innerHTML='';
    CHIPS.forEach(v=>{
      const btn = document.createElement('button');
      btn.type='button';
      btn.className = 'chip-btn' + (v===betAmount?' active':'');
      btn.textContent = '$'+v;
      btn.disabled = v>bank.player;
      btn.addEventListener('click', ()=>{ betAmount=v; renderAll(); });
      row.appendChild(btn);
    });
  }

  function renderActionArea(){
    const actionRow = document.getElementById('actionRow');
    const insuranceBanner = document.getElementById('insuranceBanner');
    const betRow = document.getElementById('betRow');
    const dealBtn = document.getElementById('dealBtn');
    const brokeNote = document.getElementById('brokeNote');

    if(phase==='insurance'){
      actionRow.style.display='none';
      insuranceBanner.style.display='block';
      betRow.classList.add('hidden');
      return;
    }
    insuranceBanner.style.display='none';

    if(phase==='idle' || phase==='result'){
      actionRow.style.display='none';
      betRow.classList.remove('hidden');
      renderChips();
      document.getElementById('betAmount').textContent = fmt(Math.min(betAmount,bank.player || betAmount));
      const broke = bank.player<=0;
      dealBtn.disabled = broke;
      dealBtn.textContent = phase==='result' ? 'Deal Next Hand' : 'Deal';
      brokeNote.style.display = broke ? 'block' : 'none';
      return;
    }

    betRow.classList.add('hidden');
    actionRow.style.display='flex';
    const hand = activeHand();
    const ready = phase==='player' && hand && !hand.done;
    document.getElementById('btnHit').disabled = !ready;
    document.getElementById('btnStand').disabled = !ready;
    document.getElementById('btnDouble').disabled = !(ready && hand.cards.length===2 && bank.player>=hand.bet);
    document.getElementById('btnSplit').disabled = !(ready && hand.cards.length===2 && hand.cards[0].r===hand.cards[1].r && hands.length<4 && bank.player>=hand.bet);
    document.getElementById('btnSurrender').disabled = !(ready && hand.cards.length===2 && hands.length===1);
  }

  function renderCounters(){
    document.getElementById('winCount').textContent = counters.win;
    document.getElementById('pushCount').textContent = counters.push;
    document.getElementById('loseCount').textContent = counters.lose;
  }

  function renderAll(){
    renderDealerRow();
    renderHandTabs();
    renderPlayerRow();
    renderHandTotal();
    renderActionArea();
    renderCounters();
    renderBank();
  }

  function updateOddsDisplay(result){
    const winBar=document.getElementById('winBar'), pushBar=document.getElementById('pushBar'), loseBar=document.getElementById('loseBar');
    const winPct=document.getElementById('winPct'), pushPct=document.getElementById('pushPct'), losePct=document.getElementById('losePct');
    const chances=document.getElementById('dealerChances');

    if(!result){
      winBar.style.width='0%'; pushBar.style.width='0%'; loseBar.style.width='0%';
      winPct.textContent='–'; pushPct.textContent='–'; losePct.textContent='–';
      chances.innerHTML = phase==='idle' ? '<p class="placeholder">Press Deal to start a hand</p>' : '<p class="placeholder">Round over</p>';
      return;
    }
    if(result==='bust'){
      winBar.style.width='0%'; pushBar.style.width='0%'; loseBar.style.width='100%';
      winPct.textContent='0.0%'; pushPct.textContent='0.0%'; losePct.textContent='100.0%';
      chances.innerHTML = '<p class="placeholder">Your hand is bust</p>';
      return;
    }

    winBar.style.width = result.win+'%';
    pushBar.style.width = result.push+'%';
    loseBar.style.width = result.lose+'%';
    winPct.textContent = result.win.toFixed(1)+'%';
    pushPct.textContent = result.push.toFixed(1)+'%';
    losePct.textContent = result.lose.toFixed(1)+'%';

    const labels = [['bust','Dealer Bust'],[17,'Dealer 17'],[18,'Dealer 18'],[19,'Dealer 19'],[20,'Dealer 20'],[21,'Dealer 21']];
    const rows = labels
      .map(([key,label])=>({label, pct: result.outcomes[key]}))
      .filter(r=>r.pct>0.05)
      .sort((a,b)=>b.pct-a.pct);

    chances.innerHTML = rows.map(r=>`
      <div class="chance-row">
        <span>${r.label}</span>
        <div class="bar small"><div class="bar-fill chance" style="width:${r.pct}%"></div></div>
        <span class="chance-pct">${r.pct.toFixed(1)}%</span>
      </div>
    `).join('');
  }

  function scheduleOdds(){
    clearTimeout(calcTimer);
    calcTimer = setTimeout(()=>{
      const hand = activeHand();
      if(!hand || hand.cards.length<2 || phase!=='player'){ return; }
      const {total, isBust} = handValue(hand.cards);
      if(isBust){ updateOddsDisplay('bust'); return; }
      const known = hand.cards.concat([dealer.cards[0]]).concat(otherHandsCards(hand));
      const result = simulateDealer(total, dealer.cards[0], known, 2000);
      updateOddsDisplay(result);
    }, 30);
  }

  // ---------- Events ----------
  document.getElementById('btnHit').addEventListener('click', doHit);
  document.getElementById('btnStand').addEventListener('click', doStand);
  document.getElementById('btnDouble').addEventListener('click', doDouble);
  document.getElementById('btnSplit').addEventListener('click', doSplit);
  document.getElementById('btnSurrender').addEventListener('click', doSurrender);
  document.getElementById('btnInsuranceYes').addEventListener('click', ()=>takeInsurance(true));
  document.getElementById('btnInsuranceNo').addEventListener('click', ()=>takeInsurance(false));
  document.getElementById('dealBtn').addEventListener('click', startRound);
  document.getElementById('resetBtn').addEventListener('click', ()=>{
    deck=[]; dealer={cards:[],holeHidden:true}; hands=[]; activeHandIndex=0;
    phase='idle'; insuranceTaken=false; counters={win:0,push:0,lose:0};
    bank = { player: STARTING_BANK, house: STARTING_BANK };
    saveBank();
    renderAll();
    updateOddsDisplay(null);
  });

  // ---------- Init ----------
  loadBank();
  renderAll();
  updateOddsDisplay(null);
})();
</script>
